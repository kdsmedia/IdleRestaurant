name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    permissions:
      contents: write   # diperlukan untuk membuat GitHub Release

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2. Cache Library Unity agar build berikutnya lebih cepat
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      # 3. Build APK menggunakan game-ci
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:      2021.3.45f1
          targetPlatform:    Android
          buildName:         IdleRestaurant
          buildsPath:        build
          androidExportType: androidPackage   # menghasilkan .apk
          versioning:        Semantic         # versi otomatis dari git tag/commit

      # 4. Buat versi otomatis dari tanggal + commit hash
      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 5. Upload APK sebagai GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Idle Restaurant ${{ steps.version.outputs.tag }}"
          body: |
            ## Build Otomatis Android

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Tanggal:** ${{ github.event.head_commit.timestamp }}

            ### Changelog
            ${{ github.event.head_commit.message }}
          files: build/Android/*.apk
          draft: false
          prerelease: false
