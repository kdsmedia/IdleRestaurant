name: Unity License Activation (Jalankan Sekali)

# Workflow ini hanya dijalankan SEKALI untuk mendapatkan file lisensi Unity.
# Setelah UNITY_LICENSE disimpan di GitHub Secrets, workflow ini tidak perlu dijalankan lagi.

on:
  workflow_dispatch: # Jalankan manual dari tab Actions di GitHub

jobs:
  activation:
    name: Request Unity License File
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file (.alf)
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_License_Request
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
