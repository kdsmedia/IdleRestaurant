name: Unity License Activation (Manual)

# Cara pakai:
# 1. Jalankan workflow ini (Run workflow)
# 2. Download artifact "Unity_Activation_File" (.alf)
# 3. Buka https://license.unity3d.com/manual → upload file .alf
# 4. Download file .ulf dari website tersebut
# 5. Buka file .ulf dengan text editor → copy semua isinya
# 6. Simpan sebagai secret UNITY_LICENSE di GitHub

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Unity Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Request Unity activation file (.alf)
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.56f2

      - name: Upload activation file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 7
