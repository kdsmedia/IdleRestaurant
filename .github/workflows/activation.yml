name: Unity License Activation (game-ci v4)

# Cara pakai:
# 1. Pastikan UNITY_EMAIL dan UNITY_PASSWORD sudah ada di GitHub Secrets
# 2. Jalankan workflow ini (Run workflow)
# 3. Jika berhasil, UNITY_LICENSE akan otomatis tersimpan via output
# 4. Download artifact "Unity_License" lalu simpan isinya sebagai secret UNITY_LICENSE

on:
  workflow_dispatch:

jobs:
  activation:
    name: Activate Unity Personal License
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Activate and create Unity license file
        id: activate
        uses: game-ci/unity-activate@v4
        env:
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.56f2

      - name: Upload license file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_License
          path: ${{ steps.activate.outputs.UNITY_LICENSE_FILE }}
          retention-days: 7
